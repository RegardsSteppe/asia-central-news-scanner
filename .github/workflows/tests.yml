# Les tests ne tournaient que dans news-scanner.yml, c'est-à-dire APRÈS
# le merge sur main : une pull request ne pouvait pas être rouge, et une
# régression n'était visible qu'une fois en production.
name: Tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      # Exactement les versions de la production (requirements.txt),
      # sans les dépendances du modèle de langage (requirements-llm.txt)
      # que les tests mockent. Installer les mêmes versions est ce qui
      # fait qu'un épinglage impossible rougit ici, avant le merge :
      # cette étape installait des versions libres, elle a donc laissé
      # passer un pin exigeant Python 3.11 qui a cassé le run #142.
      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
