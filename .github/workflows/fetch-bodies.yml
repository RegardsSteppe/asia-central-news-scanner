name: Fetch Full Article Bodies (RunPod benchmark)

# Outil ponctuel, déclenché à la main : télécharge le corps complet de
# CHAQUE article du dernier articles.csv publié (~6800, contre les
# ~600 enrichis par le scan quotidien) pour nourrir le benchmark
# RunPod LLM-vs-déterministe (voir RUNPOD.md). Ne modifie rien dans le
# repo — le résultat est uniquement déposé comme artefact du run,
# jamais commité (fichier volumineux, à usage ponctuel).

on:
  workflow_dispatch:
    inputs:
      workers:
        description: "Téléchargements en parallèle"
        required: false
        default: "30"

permissions:
  contents: read
  actions: read  # pour retrouver l'artefact du run précédent (reprise, voir plus bas)

jobs:
  fetch-bodies:
    runs-on: ubuntu-latest
    # 180 min a été atteint deux fois de suite (voir fetch_all_bodies.py:
    # le vrai correctif du 2026-09-12 sépare le pool Google News du pool
    # principal, qui ne devrait plus être affamé) — marge de sécurité en
    # plus au cas où d'autres sources lentes/à répétition ralentissent
    # le pool principal.
    timeout-minutes: 240

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install dependencies
        run: pip install feedparser requests beautifulsoup4

      - name: Download latest articles.csv (published site)
        run: >-
          curl -sSf -o articles.csv
          "https://raw.githubusercontent.com/${{ github.repository }}/gh-pages/articles.csv"

      - name: Look up previous run's results (for --resume-from)
        # 4 runs consécutifs (2026-09-11/12) ont chacun perdu 100% de
        # leur progression au timeout : un corpus de ~6800 articles
        # prend plusieurs heures, et rien n'était jamais écrit sur
        # disque avant la toute fin. fetch_all_bodies.py checkpointe
        # désormais en cours de route (voir son "Upload result as
        # artifact" ci-dessous, qui tourne même si ce job est annulé) —
        # ce step retrouve le dernier artefact "articles-with-body"
        # produit par CE workflow (même partiel) pour ne jamais
        # re-télécharger ce qui a déjà réussi.
        id: previous_artifact
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          curl -sS -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/artifacts?name=articles-with-body&per_page=20" \
            -o artifacts.json

          DOWNLOAD_URL=$(python3 -c "
          import json

          with open('artifacts.json', encoding='utf-8') as handle:
              data = json.load(handle)

          artifacts = [a for a in data.get('artifacts', []) if not a.get('expired')]
          artifacts.sort(key=lambda a: a['created_at'], reverse=True)
          print(artifacts[0]['archive_download_url'] if artifacts else '')
          ")

          if [ -n "$DOWNLOAD_URL" ]; then
            curl -sSL -H "Authorization: Bearer $GH_TOKEN" -o previous_artifact.zip "$DOWNLOAD_URL"
            mkdir -p previous_result
            unzip -o previous_artifact.zip -d previous_result
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Fetch full bodies for every article
        # Run #3 (2026-09-12) : le pool séparé Google News a bien
        # marché (taux d'échec 81% -> 24%), mais le débit ralentissait
        # quand même avec le temps (39 -> 7.7 articles/min sur 4h) :
        # certaines sources (chathamhouse.org, stimson.org, ng.ru...)
        # traînent ou expirent, et chaque échec de ce type peut coûter
        # jusqu'à ~93s (30s de timeout x jusqu'à 3 tentatives +
        # backoff, voir http_utils.py) à un thread du pool. Ce script
        # étant un one-off (jamais le scan quotidien), on réduit ce
        # budget ici seulement via les variables d'env déjà prévues par
        # http_utils.py, sans toucher son comportement par défaut.
        env:
          SCANNER_HTTP_CONNECT_TIMEOUT: "5"
          SCANNER_HTTP_READ_TIMEOUT: "12"
          SCANNER_HTTP_MAX_ATTEMPTS: "2"
          SCANNER_HTTP_RETRY_BACKOFF_BASE: "1"
        run: >-
          python fetch_all_bodies.py
          --input articles.csv
          --output articles_with_body.json
          --workers "${{ github.event.inputs.workers }}"
          ${{ steps.previous_artifact.outputs.found == 'true' && '--resume-from previous_result/articles_with_body.json' || '' }}

      - name: Upload result as artifact
        # if: always() : ce step doit tourner même si le précédent a
        # été annulé par le timeout du job, pour uploader le dernier
        # checkpoint écrit sur disque (voir fetch_all_bodies.py) au
        # lieu de perdre toute la progression du run.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: articles-with-body
          path: articles_with_body.json
          retention-days: 30
          if-no-files-found: ignore
