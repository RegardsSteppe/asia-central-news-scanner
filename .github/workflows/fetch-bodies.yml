name: Fetch Full Article Bodies (RunPod benchmark)

# Outil ponctuel, déclenché à la main : télécharge le corps complet de
# CHAQUE article du dernier articles.csv publié (~6800, contre les
# ~600 enrichis par le scan quotidien) pour nourrir le benchmark
# RunPod LLM-vs-déterministe (voir RUNPOD.md). Ne modifie rien dans le
# repo — le résultat est uniquement déposé comme artefact du run,
# jamais commité (fichier volumineux, à usage ponctuel).

on:
  workflow_dispatch:
    inputs:
      workers:
        description: "Téléchargements en parallèle"
        required: false
        default: "20"

permissions:
  contents: read

jobs:
  fetch-bodies:
    runs-on: ubuntu-latest
    # 180 min a été atteint deux fois de suite (voir fetch_all_bodies.py:
    # le vrai correctif du 2026-09-12 sépare le pool Google News du pool
    # principal, qui ne devrait plus être affamé) — marge de sécurité en
    # plus au cas où d'autres sources lentes/à répétition ralentissent
    # le pool principal.
    timeout-minutes: 240

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install dependencies
        run: pip install feedparser requests beautifulsoup4

      - name: Download latest articles.csv (published site)
        run: >-
          curl -sSf -o articles.csv
          "https://raw.githubusercontent.com/${{ github.repository }}/gh-pages/articles.csv"

      - name: Fetch full bodies for every article
        run: >-
          python fetch_all_bodies.py
          --input articles.csv
          --output articles_with_body.json
          --workers "${{ github.event.inputs.workers }}"

      - name: Upload result as artifact
        uses: actions/upload-artifact@v4
        with:
          name: articles-with-body
          path: articles_with_body.json
          retention-days: 30
