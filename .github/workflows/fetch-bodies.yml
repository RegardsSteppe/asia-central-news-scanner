name: Fetch Full Article Bodies

# Remplit archive.jsonl en une passe, à la demande.
#
# Le scan quotidien télécharge déjà le corps des articles qui n'en ont
# pas (voir enrich_articles + archive.backfill_bodies), mais par
# tranches d'environ 300 par run : au rythme mesuré le 2026-09-14,
# saturer la part récupérable du corpus lui demande une quinzaine de
# jours. Ce workflow fait le même travail d'un coup, avec un budget de
# 4 h, et commite le résultat.
#
# Il ne remplace pas le scan quotidien et ne publie pas le site : il ne
# touche qu'à archive.jsonl. Le scan suivant republie à partir de là,
# avec des catégories mieux remplies.
#
# La reprise ne dépend plus d'un artefact à retrouver : les corps sont
# écrits dans l'archive en cours de route, donc un run tué par le
# timeout garde ce qu'il a récupéré et le run suivant ne resélectionne
# pas ces entrées.

on:
  workflow_dispatch:
    inputs:
      workers:
        description: "Téléchargements en parallèle"
        required: false
        default: "30"
      limit:
        description: >-
          Ne traiter que les N premières entrées sans corps (vide = tout).
          Utile pour un essai avant de lancer les 4 h.
        required: false
        default: ""

permissions:
  contents: write

# Deux remplissages simultanés se disputeraient le même fichier sans
# rien gagner : le second ne verrait que ce que le premier n'a pas
# encore écrit.
concurrency:
  group: fetch-bodies
  cancel-in-progress: false

jobs:
  fetch-bodies:
    runs-on: ubuntu-latest
    # 180 min a été atteint deux fois de suite avant que le pool Google
    # News ne soit séparé du pool principal (voir fetch_all_bodies.py).
    # Ces URLs ne sont désormais plus téléchargées du tout — un tiers du
    # corpus en moins — mais la marge est conservée.
    timeout-minutes: 240

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fill the archive with full article bodies
        # Run #3 (2026-09-12) : le pool séparé Google News a bien
        # marché (taux d'échec 81% -> 24%), mais le débit ralentissait
        # quand même avec le temps (39 -> 7.7 articles/min sur 4h) :
        # certaines sources (chathamhouse.org, stimson.org, ng.ru...)
        # traînent ou expirent, et chaque échec de ce type peut coûter
        # jusqu'à ~93s (30s de timeout x jusqu'à 3 tentatives +
        # backoff, voir http_utils.py) à un thread du pool. Ce workflow
        # étant ponctuel (jamais le scan quotidien), on réduit ce
        # budget ici seulement via les variables d'env déjà prévues par
        # http_utils.py, sans toucher son comportement par défaut.
        env:
          SCANNER_HTTP_CONNECT_TIMEOUT: "5"
          SCANNER_HTTP_READ_TIMEOUT: "12"
          SCANNER_HTTP_MAX_ATTEMPTS: "2"
          SCANNER_HTTP_RETRY_BACKOFF_BASE: "1"
        run: >-
          python fetch_all_bodies.py
          --archive
          --workers "${{ github.event.inputs.workers }}"
          ${{ github.event.inputs.limit != '' && format('--limit {0}', github.event.inputs.limit) || '' }}

      - name: Commit the bodies
        # if: always() : ce step doit tourner même si le précédent a été
        # annulé par le timeout du job. Sans lui, un run coupé à 90%
        # perdrait ses 90% — exactement ce qui est arrivé quatre fois de
        # suite en 2026-09, quand le résultat n'existait que dans un
        # fichier jamais commité.
        if: always()
        run: |
          if [ -z "$(git status --porcelain -- archive.jsonl)" ]; then
            echo "nothing to persist"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          mkdir -p /tmp/persist
          cp archive.jsonl /tmp/persist/archive.jsonl

          # Le scan quotidien peut avoir poussé pendant ces heures. On
          # ne réécrit jamais sa version par-dessus la nôtre : on prend
          # l'union, qui porte aussi sur les corps (archive.merge_files)
          # — sinon un conflit de push coûterait tout le téléchargement.
          for attempt in 1 2 3 4 5; do
            python archive.py --merge-into archive.jsonl /tmp/persist/archive.jsonl

            if [ -n "$(git status --porcelain -- archive.jsonl)" ]; then
              git add archive.jsonl
              git commit -m "Fill article bodies in the archive [skip ci]"
            fi

            if git push; then
              exit 0
            fi

            echo "Push rejected (attempt $attempt/5), resetting onto latest ${GITHUB_REF_NAME}..."
            git fetch origin "${GITHUB_REF_NAME}"
            git reset --hard "origin/${GITHUB_REF_NAME}"
            sleep $((attempt * 3))
          done

          echo "::error::Failed to push after 5 attempts"
          exit 1
