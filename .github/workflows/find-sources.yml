name: Find Candidate Sources

# Outil ponctuel, déclenché à la main : regarde les liens sortants
# cités dans le corps des articles de niveau A (et/ou B) déjà publiés
# pour repérer des sources externes non encore couvertes par
# sources.py. Ne modifie rien, ne publie rien — juste un rapport dans
# les logs du job. Séparé de news-scanner.yml pour ne jamais alourdir
# le scan quotidien (pas de llama-cpp-python ici).

on:
  workflow_dispatch:
    inputs:
      levels:
        description: "Niveaux à analyser (ex: A ou A,B)"
        required: false
        default: "A"

permissions:
  contents: read

jobs:
  find-sources:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Download latest articles.csv (published site)
        run: >-
          curl -sSf -o articles.csv
          "https://raw.githubusercontent.com/${{ github.repository }}/gh-pages/articles.csv"

      - name: Find candidate sources
        run: >-
          python find_candidate_sources.py
          --levels "${{ github.event.inputs.levels }}"
