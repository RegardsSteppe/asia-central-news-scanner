```yaml
name: Asia Central News Scanner

on:
  schedule:
    - cron: '0 6 * * *'  # 08:00 Paris en heure d'été
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan-news:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run news scanner
        shell: bash
        run: |
          set -o pipefail
          python -u news_scanner.py 2>&1 | tee news_scanner.log

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: news-scanner-logs
          path: news_scanner.log
          retention-days: 7

      - name: Prepare website
        if: success()
        run: |
          mkdir -p public
          cp index.html public/index.html

      - name: Publish website
        if: success()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: gh-pages
```
