name: Asia Central News Scanner

on:
  workflow_dispatch:
    inputs:
      force_refresh:
        description: "Force full re-scan (ignore HTTP cache and per-source freshness memory)"
        required: false
        type: boolean
        default: false
  schedule:
    - cron: "0 6 * * *"

permissions:
  contents: write

jobs:
  scan-news:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Run scanner
        run: >-
          python news_scanner.py
          ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.force_refresh == 'true') && '--scan' || '' }}

      - name: Prepare website
        run: |
          mkdir -p public
          cp index.html public/
          cp articles.csv public/

      - name: Publish
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: gh-pages

      # Runs after publishing: the site going live must never be blocked by
      # this step. main can move while the scan runs (a merge landing, or a
      # concurrent run), so a plain `git push` can be rejected as
      # non-fast-forward — retry with a rebase onto the latest branch tip
      # instead of failing the whole job.
      - name: Persist scanner memory
        run: |
          if [ -z "$(git status --porcelain -- memory.json)" ]; then
            echo "memory.json unchanged, nothing to persist"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add memory.json
          git commit -m "Update scanner memory [skip ci]"

          for attempt in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "Push rejected (attempt $attempt/5), rebasing onto latest ${GITHUB_REF_NAME}..."
            git fetch origin "${GITHUB_REF_NAME}"
            git rebase "origin/${GITHUB_REF_NAME}"
            sleep $((attempt * 3))
          done

          echo "::error::Failed to push memory.json after 5 attempts"
          exit 1
