name: Asia Central News Scanner

on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:

jobs:
  scan-news:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Run news scanner
        env:
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
        run: python -c "from news_scanner import fetch_all_news, send_email; news_data = fetch_all_news(); send_email(news_data)"
      
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: news-scanner-logs
          path: news_scanner.log
          retention-days: 7
