name: Asia Central News Scanner

on:
  workflow_dispatch:
    inputs:
      force_refresh:
        description: "Force full re-scan (ignore HTTP cache and per-source freshness memory) — slow, re-fetches every source"
        required: false
        type: boolean
        default: false
  schedule:
    - cron: "0 6 * * *"

permissions:
  contents: write

jobs:
  scan-news:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Run scanner
        env:
          # index.html/articles.csv are fully regenerated (not merged) on
          # every run, so filtering out "already seen" articles here does
          # not trim a running history — it silently shrinks the *whole*
          # published site down to only what's new since the last run.
          # Confirmed live 2026-09-13: a run that had just marked ~6700
          # articles as seen was followed six hours later by the next
          # scheduled run publishing only the ~2100 genuinely-new ones.
          # Always publish the full current corpus instead.
          SCANNER_SKIP_PREVIOUSLY_SEEN: "0"
        run: >-
          python news_scanner.py
          ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.force_refresh == 'true') && '--scan' || '' }}

      - name: Prepare website
        run: |
          mkdir -p public
          cp index.html public/
          cp articles.csv public/

      - name: Publish
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: gh-pages

      # Runs after publishing: the site going live must never be blocked by
      # this step. main can move while the scan runs (a merge landing, or a
      # concurrent run), so a plain `git push` can be rejected as
      # non-fast-forward.
      #
      # Retries by resetting onto the latest branch tip and re-applying our
      # own freshly-generated memory.json on top, rather than rebasing the
      # commit: memory.json is a cache (freshness timestamps, seen-article
      # keys), so "our version replayed on latest main" is always the right
      # resolution — a 3-way merge/rebase can hit a real conflict on this
      # file (two concurrent runs touching the same JSON keys) and, under
      # `bash -e`, a conflicting `git rebase` aborts the whole step instead
      # of retrying. Confirmed live: two runs triggered ~4 min apart raced
      # here and the rebase-based retry exited after attempt 1/5 instead of
      # retrying, even though the site itself had already published fine.
      - name: Persist scanner memory
        run: |
          if [ -z "$(git status --porcelain -- memory.json)" ]; then
            echo "memory.json unchanged, nothing to persist"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          cp memory.json /tmp/memory.json.new

          for attempt in 1 2 3 4 5; do
            cp /tmp/memory.json.new memory.json
            if [ -n "$(git status --porcelain -- memory.json)" ]; then
              git add memory.json
              git commit -m "Update scanner memory [skip ci]"
            fi
            if git push; then
              exit 0
            fi
            echo "Push rejected (attempt $attempt/5), resetting onto latest ${GITHUB_REF_NAME}..."
            git fetch origin "${GITHUB_REF_NAME}"
            git reset --hard "origin/${GITHUB_REF_NAME}"
            sleep $((attempt * 3))
          done

          echo "::error::Failed to push memory.json after 5 attempts"
          exit 1
